7F8" height="24" rx="10" ry="10" stroke="none" stroke-width="0" width="320.0" x="1215.0" y="427" /><text fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="16" font-weight="700" x="1225.0" y="445">#/admin/pagos</text><text fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="800" letter-spacing="1" x="63" y="514">02  /  DECISIONES, ERRORES Y ALCANCE</text><rect fill="#EEE7F8" height="210" rx="17" ry="17" stroke="none" stroke-width="0" width="482.0" x="63.0" y="548" /><text fill="#48119A" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="760" x="85.0" y="591">ACCESO / ALTERNATIVA</text><text fill="#25232B" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="400" x="85.0" y="639"><tspan dy="0" x="85.0">No accede a portada pública, probador,</tspan><tspan dy="31" x="85.0">mensajes ni paneles profesionales.</tspan></text><rect fill="#E8DCCB" height="210" rx="17" ry="17" stroke="none" stroke-width="0" width="482.0" x="567.0" y="548" /><text fill="#25232B" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="760" x="589.0" y="591">ERROR / ESTADO VACÍO</text><text fill="#25232B" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="400" x="589.0" y="639"><tspan dy="0" x="589.0">Exportar pagos solo muestra aviso: no</tspan><tspan dy="31" x="589.0">genera XLSX. El acceso erróneo redirige</tspan><tspan dy="31" x="589.0">al panel.</tspan></text><rect fill="#E4EEE7" height="210" rx="17" ry="17" stroke="none" stroke-width="0" width="482.0" x="1071.0" y="548" /><text fill="#25232B" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="760" x="1093.0" y="591">ALCANCE COMPROBADO</text><text fill="#25232B" font-family="Poppins,DejaVu Sans,sans-serif" font-size="22" font-weight="400" x="1093.0" y="639"><tspan dy="0" x="1093.0">Destacado de playlist sí cambia datos</tspan><tspan dy="31" x="1093.0">locales; cobros y reembolsos no son</tspan><tspan dy="31" x="1093.0">transacciones reales.</tspan></text><text fill="#595665" font-family="Poppins,DejaVu Sans,sans-serif" font-size="19" x="63" y="818">Evidencia: R01, F14-F15 y panel admin · commit f72f71d.</text></svg>